# Runs both the poller and the review app as containers, sharing one
# built image. network_mode: host keeps everything reachable exactly the
# way it already is -- Ollama on 127.0.0.1:11434, the review app on
# 127.0.0.1:5000 for nginx to proxy to -- no nginx or Ollama changes needed.
#
# knowledge/, chroma_db/, and logs/ are bind-mounted from the host so your
# actual knowledge base and audit trail persist across container rebuilds
# and stay editable without touching the image.

services:
  poller:
    build: .
    image: email-agent:latest
    container_name: email-agent-poller
    command: ["python", "main.py", "--mode", "poll"]
    network_mode: "host"
    env_file: .env
    volumes:
      - ./knowledge:/app/knowledge
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped

  review:
    build: .
    image: email-agent:latest
    container_name: email-agent-review
    command: ["gunicorn", "--preload", "-w", "2", "-b", "127.0.0.1:5000", "review_app:app"]
    network_mode: "host"
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - poller
